<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smile HQ Dental Clinic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        header {
            background-color: #ffffff;
            padding: 15px;
            text-align: center;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }
        header img {
            height: 80px;
            object-fit: contain;
            background: transparent;
        }
        section {
            padding: 40px;
            text-align: center;
        }
        .doctor img {
            max-width: 300px;
            border-radius: 15px;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
        .clinic-gallery {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .clinic-gallery img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
        footer {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Logo -->
    <header>
        <img src="Dental%20Clinic%20Website/Images/logo.png" alt="Smile HQ Logo">
        <h1>Smile HQ Dental Clinic</h1>
    </header>

    <!-- Meet Doctor Anita -->
    <section class="doctor">
        <h2>Meet Doctor Anita</h2>
        <img src="Dental%20Clinic%20Website/Images/Website%20Pic.JPEG" alt="Doctor Anita">
        <p>Dr. Anita is a highly skilled dentist with years of experience in providing exceptional dental care. At Smile HQ, your smile is our priority.</p>
    </section>

    <!-- A Look Inside Our Clinic -->
    <section>
        <h2>A Look Inside Our Clinic</h2>
        <div class="clinic-gallery">
            <img src="Dental%20Clinic%20Website/Images/p1.png" alt="Clinic View 1">
            <img src="Dental%20Clinic%20Website/Images/p2.png" alt="Clinic View 2">
            <img src="Dental%20Clinic%20Website/Images/p3.png" alt="Clinic View 3">
            <img src="Dental%20Clinic%20Website/Images/p4.png" alt="Clinic View 4">
            <img src="Dental%20Clinic%20Website/Images/p5.png" alt="Clinic View 5">
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Smile HQ Dental Clinic | All Rights Reserved</p>
    </footer>

</body>
</html>
